document.addEventListener('DOMContentLoaded', async function() {
  const loading = document.getElementById('__bundler_loading');
  function setStatus(msg) { if (loading) loading.textContent = msg; }

  // Error sink persists across replaceWith since it's on window, not the DOM.
  window.addEventListener('error', function(e) {
    var p = document.body || document.documentElement;
    var d = document.getElementById('__bundler_err') || p.appendChild(document.createElement('div'));
    d.id = '__bundler_err';
    d.style.cssText = 'position:fixed;bottom:12px;left:12px;right:12px;font:12px/1.4 ui-monospace,monospace;background:#2a1215;color:#ff8a80;padding:10px 14px;border-radius:8px;border:1px solid #5c2b2e;z-index:99999;white-space:pre-wrap;max-height:40vh;overflow:auto';
    d.textContent = (d.textContent ? d.textContent + String.fromCharCode(10) : '') +
      '[bundle] ' + (e.message || e.type) +
      (e.filename ? ' (' + e.filename.slice(0, 60) + ':' + e.lineno + ')' : '');
  }, true);

  try {
    const manifestEl = document.querySelector('script[type="__bundler/manifest"]');
    const templateEl = document.querySelector('script[type="__bundler/template"]');
    if (!manifestEl || !templateEl) {
      setStatus('Error: missing bundle data');
      console.error('[bundler] Missing script tags — manifestEl:', !!manifestEl, 'templateEl:', !!templateEl);
      return;
    }

    const manifest = JSON.parse(manifestEl.textContent);
    let template = JSON.parse(templateEl.textContent);

    const uuids = Object.keys(manifest);
    setStatus('Unpacking ' + uuids.length + ' assets...');

    const blobUrls = {};
    await Promise.all(uuids.map(async (uuid) => {
      const entry = manifest[uuid];
      try {
        const binaryStr = atob(entry.data);
        const bytes = new Uint8Array(binaryStr.length);
        for (let i = 0; i < binaryStr.length; i++) bytes[i] = binaryStr.charCodeAt(i);

        let finalBytes = bytes;
        if (entry.compressed) {
          if (typeof DecompressionStream !== 'undefined') {
            const ds = new DecompressionStream('gzip');
            const writer = ds.writable.getWriter();
            const reader = ds.readable.getReader();
            writer.write(bytes);
            writer.close();
            const chunks = [];
            let totalLen = 0;
            while (true) {
              const { done, value } = await reader.read();
              if (done) break;
              chunks.push(value);
              totalLen += value.length;
            }
            finalBytes = new Uint8Array(totalLen);
            let offset = 0;
            for (const chunk of chunks) { finalBytes.set(chunk, offset); offset += chunk.length; }
          } else {
            console.warn('DecompressionStream not available, asset ' + uuid + ' may not render');
          }
        }

        blobUrls[uuid] = URL.createObjectURL(new Blob([finalBytes], { type: entry.mime }));
      } catch (err) {
        console.error('Failed to decode asset ' + uuid + ':', err);
        blobUrls[uuid] = URL.createObjectURL(new Blob([], { type: entry.mime }));
      }
    }));

    const extResEl = document.querySelector('script[type="__bundler/ext_resources"]');
    const extResources = extResEl ? JSON.parse(extResEl.textContent) : [];
    const resourceMap = {};
    for (const entry of extResources) {
      if (blobUrls[entry.uuid]) resourceMap[entry.id] = blobUrls[entry.uuid];
    }

    setStatus('Rendering...');
    for (const uuid of uuids) template = template.split(uuid).join(blobUrls[uuid]);

    // Strip integrity + crossorigin — blob URLs from a file:// document inherit
    // a null origin, so crossorigin forces a CORS fetch that SRI then rejects.
    // The manifest bytes are ours; SRI protects against CDN compromise, not this.
    template = template.replace(/\s+integrity="[^"]*"/gi, '').replace(/\s+crossorigin="[^"]*"/gi, '');

    const resourceScript = '<script>window.__resources = ' +
      JSON.stringify(resourceMap).split('</' + 'script>').join('<\\/' + 'script>') +
      ';</' + 'script>';
    // Inject after <head> so the DOCTYPE stays first; prepending the script
    // would push the parser into quirks mode. DOMParser always emits a <head>
    // (synthesizing one if the source HTML omitted it) but may carry
    // attributes through, so match the full opening tag. slice() rather than
    // replace() keeps us clear of $-pattern substitution in resourceScript.
    const headOpen = template.match(/<head[^>]*>/i);
    if (headOpen) {
      const i = headOpen.index + headOpen[0].length;
      template = template.slice(0, i) + resourceScript + template.slice(i);
    }

    // Parse the template and swap the root element. Scripts inserted via
    // DOMParser/replaceWith are inert per spec — re-create each with
    // createElement so they execute, awaiting onload for src scripts to
    // preserve ordering (React before ReactDOM before Babel before text/babel).
    const doc = new DOMParser().parseFromString(template, 'text/html');
    document.documentElement.replaceWith(doc.documentElement);
    const dead = Array.from(document.scripts);
    for (const old of dead) {
      const s = document.createElement('script');
      for (const a of old.attributes) s.setAttribute(a.name, a.value);
      s.textContent = old.textContent;
      // text/babel scripts with a src: fetch and inline. transformScriptTags
      // does XHR against the src, but blob:null/ from a file:// origin is
      // silently dropped. Inlining makes it a plain inline babel script,
      // which transformScriptTags handles unconditionally.
      if ((s.type === 'text/babel' || s.type === 'text/jsx') && s.src) {
        const r = await fetch(s.src);
        s.textContent = await r.text();
        s.removeAttribute('src');
      }
      const p = s.src ? new Promise(function(r) { s.onload = s.onerror = r; }) : null;
      old.replaceWith(s);
      if (p) await p;
    }
    // Babel standalone auto-transforms type=text/babel on DOMContentLoaded,
    // which fired before we swapped the document. Trigger manually if present.
    if (window.Babel && typeof window.Babel.transformScriptTags === 'function') {
      window.Babel.transformScriptTags();
    }
  } catch (err) {
    setStatus('Error unpacking: ' + err.message);
    console.error('Bundle unpack error:', err);
  }
});

:18px;color:oklch(0.45 0.005 90);margin-top:22px;line-height:1.6;max-width:560px;margin-left:auto;margin-right:auto\">\n      We help teams commercializing new technology build the proof points that turn promising research into real commercial opportunity.\n    <\u002Fdiv>\n    <div style=\"display:flex;gap:16px;justify-content:center;margin-top:32px\">\n      <div style=\"font-size:15px;font-weight:600;color:#fff;background:oklch(0.15 0.005 90);padding:14px 28px;border-radius:8px\">Book a conversation →<\u002Fdiv>\n      <div style=\"font-size:15px;font-weight:600;color:oklch(0.2 0.005 90);border:1.5px solid oklch(0.85 0.005 90);padding:14px 28px;border-radius:8px\">See our work<\u002Fdiv>\n    <\u002Fdiv>\n  <\u002Fdiv>\n\n  <!-- BIO -->\n  <div style=\"max-width:1000px;margin:96px auto 0;padding:0 32px;display:flex;gap:48px;align-items:center\">\n    <div style=\"width:280px;height:280px;flex:0 0 280px\">\n      <x-import component-from-global-scope=\"image-slot\" from=\"c6c56354-67a4-4c22-9c47-674a6dbb7b0c#/image-slot.js\" id=\"bio-photo\" shape=\"circle\" placeholder=\"Drop your photo\" src=\"./logo-assets/connor-headshot.jpg\" dc-props=\"{{ bioPhotoStyle }}\" style=\"width:100%;height:100%\" hint-size=\"280px,280px\"><\u002Fx-import>\n    <\u002Fdiv>\n    <div>\n      <div style=\"font-size:13px;letter-spacing:0.1em;text-transform:uppercase;color:oklch(0.58 0.16 45);font-weight:600;margin-bottom:14px\">Who's behind it<\u002Fdiv>\n      <div style=\"font-size:28px;font-weight:600;letter-spacing:-0.02em;color:oklch(0.15 0.005 90);margin-bottom:6px\">Connor McCarthy<\u002Fdiv>\n      <div style=\"font-size:15px;font-weight:500;color:oklch(0.5 0.005 90);margin-bottom:18px\">Founder, Proof Point Advisory<\u002Fdiv>\n      <div style=\"font-size:15.5px;color:oklch(0.42 0.005 90);line-height:1.7\">\n        I've spent my career at the intersection of emerging technology and commercialization — most recently leading venture and commercialization work at Newlab, where I've activated and de-risked high-growth startups through commercial pilots, industry partnerships, and structured innovation programs with enterprise and public-sector partners. That work has shaped state drone policy, driven $1M+ in advisory engagements across commercial, government, and defense sectors, and moved emerging technologies from pilot to real-world deployment. Proof Point Advisory is where I bring that same discipline to your technology — building the commercial proof points that turn potential into traction.\n      <\u002Fdiv>\n    <\u002Fdiv>\n  <\u002Fdiv>\n\n  <!-- TRUSTED BY STRIP -->\n  <div style=\"max-width:1200px;margin:76px auto 0;padding:28px 32px;border-top:1px solid oklch(0.9 0.005 90);border-bottom:1px solid oklch(0.9 0.005 90)\">\n    <div style=\"font-size:12px;letter-spacing:0.1em;text-transform:uppercase;color:oklch(0.55 0.005 90);text-align:center;margin-bottom:22px\">Trusted by teams commercializing deep tech<\u002Fdiv>\n    <div style=\"display:flex;justify-content:space-between;gap:24px;flex-wrap:wrap\">\n      <sc-for list=\"{{ logos }}\" as=\"l\" hint-placeholder-count=\"5\">\n        <div style=\"flex:1;min-width:120px;height:28px;background:repeating-linear-gradient(45deg, oklch(0.9 0.005 90), oklch(0.9 0.005 90) 6px, oklch(0.94 0.002 90) 6px, oklch(0.94 0.002 90) 12px);border-radius:4px;display:flex;align-items:center;justify-content:center;font-size:10px;color:oklch(0.5 0.005 90);font-family:ui-monospace,monospace\">{{ l }}<\u002Fdiv>\n      <\u002Fsc-for>\n    <\u002Fdiv>\n  <\u002Fdiv>\n\n  <!-- WHAT WE DO -->\n  <div style=\"max-width:1200px;margin:96px auto 0;padding:0 32px\">\n    <div style=\"text-align:center;margin-bottom:48px\">\n      <div style=\"font-size:13px;letter-spacing:0.1em;text-transform:uppercase;color:oklch(0.58 0.16 45);font-weight:600;margin-bottom:14px\">What we do<\u002Fdiv>\n      <div style=\"font-size:34px;font-weight:600;letter-spacing:-0.02em;color:oklch(0.15 0.005 90)\">Three moves from lab to 68 0.16 45)\"><\u002Fdiv>\n        <\u002Fdiv>\n        <div style=\"font-size:19px;font-weight:600;color:oklch(0.15 0.005 90);margin-bottom:10px\">Go-to-market advisory<\u002Fdiv>\n        <div style=\"font-size:14.5px;color:oklch(0.48 0.005 90);line-height:1.65\">A commercialization plan built on your proof points, not on hope — channels, pricing, and positioning.<\u002Fdiv>\n      <\u002Fdiv>\n    <\u002Fdiv>\n  <\u002Fdiv>\n\n  <!-- CASE STUDIES -->\n  <div style=\"max-width:1200px;margin:112px auto 0;padding:0 32px\">\n    <div style=\"display:flex;justify-content:space-between;align-items:flex-end;margin-bottom:36px\">\n      <div>\n        <div style=\"font-size:13px;letter-spacing:0.1em;text-transform:uppercase;color:oklch(0.58 0.16 45);font-weight:600;margin-bottom:14px\">Case studies<\u002Fdiv>\n        <div style=\"font-size:34px;font-weight:600;letter-spacing:-0.02em;color:oklch(0.15 0.005 90)\">Proof points that closed deals<\u002Fdiv>\n      <\u002Fdiv>\n      <div style=\"font-size:14.5px;font-weight:600;color:oklch(0.2 0.005 90);white-space:nowrap\">View all →<\u002Fdiv>\n    <\u002Fdiv>\n    <div style=\"display:grid;grid-template-columns:1fr 1fr;gap:28px\">\n      <div style=\"background:oklch(0.15 0.005 90);border-radius:16px;padding:40px;color:#fff;display:flex;flex-direction:column;justify-content:space-between;min-height:280px\">\n        <div>\n          <div style=\"font-size:12px;letter-spacing:0.08em;text-transform:uppercase;color:oklch(0.68 0.16 45);font-weight:600;margin-bottom:14px\">Advanced materials startup<\u002Fdiv>\n          <div style=\"font-size:22px;font-weight:600;line-height:1.35\">Turned a lab result into a signed pilot with a Fortune 500 manufacturer<\u002Fdiv>\n        <\u002Fdiv>\n        <div style=\"font-size:14px;font-weight:600;color:oklch(0.75 0.005 90);margin-top:24px\">Read the case study →<\u002Fdiv>\n      <\u002Fdiv>\n      <div style=\"background:#fff;border:1px solid oklch(0.91 0.005 90);border-radius:16px;padding:40px;display:flex;flex-direction:column;justify-content:space-between;min-height:280px\">\n        <div>\n          <div style=\"font-size:12px;letter-spacing:0.08em;text-transform:uppercase;color:oklch(0.58 0.16 45);font-weight:600;margin-bottom:14px\">Climate tech spinout<\u002Fdiv>\n          <div style=\"font-size:22px;font-weight:600;line-height:1.35;color:oklch(0.15 0.005 90)\">Built the commercial proof that unlocked a $12M Series A<\u002Fdiv>\n        <\u002Fdiv>\n        <div style=\"font-size:14px;font-weight:600;color:oklch(0.2 0.005 90);margin-top:24px\">Read the case study →<\u002Fdiv>\n      <\u002Fdiv>\n    <\u002Fdiv>\n  <\u002Fdiv>\n\n  <!-- TESTIMONIAL -->\n  <div style=\"max-width:900px;margin:112px auto 0;padding:0 32px;text-align:center\">\n    <div style=\"font-size:26px;font-weight:500;line-height:1.5;color:oklch(0.15 0.005 90);letter-spacing:-0.01em\">\n      \"They didn't just tell us our tech was ready — they helped us prove it, in the language our first customer needed to hear.\"\n    <\u002Fdiv>\n    <div style=\"margin-top:24px;font-size:14.5px;font-weight:600;color:oklch(0.45 0.005 90)\">Founder &amp; CEO, Advanced Materials Startup<\u002Fdiv>\n  <\u002Fdiv>\n\n  <!-- INSIGHTS -->\n  <div style=\"max-width:1200px;margin:112px auto 0;padding:0 32px\">\n    <div style=\"display:flex;justify-content:space-between;align-items:flex-end;margin-bottom:36px\">\n      <div style=\"font-size:34px;font-weight:600;letter-spacing:-0.02em;color:oklch(0.15 0.005 90)\">Latest thinking<\u002Fdiv>\n      <div style=\"font-size:14.5px;font-weight:600;color:oklch(0.2 0.005 90);white-space:nowrap\">All insights →<\u002Fdiv>\n    <\u002Fdiv>\n    <div style=\"display:grid;grid-template-columns:repeat(2,1fr);gap:28px\">\n      <div>\n        <div style=\"height:180px;border-radius:14px;background:repeating-linear-gradient(45deg, oklch(0.93 0.005 90), oklch(0.93 0.005 90) 10px, oklch(0.96 0.002 90) 10px, oklch(0.96 0.002 90) 20px);display:flex;align-items:center;justify-content:center;font-size:12px;color:oklch(0.55 0.005 90);font-family:ui-monospace,monospace;margin-bottom:18px\">article image<\u002Fdiv>\n        <div style=\"font-size:12px;letter-spacing:0.06em;text-transform:uppercase;color:oklch(0.58 0.16 45);font-weight:600;margin-bottom:8px\">Commercialization<\u002Fdiv>\n        <div style=\"font-size:19px;font-weight:600;color:oklch(0.15 0.005 90);line-height:1.4\">What counts as a \"proof point\" to a first customer<\u002Fdiv>\n      <\u002Fdiv>\n      <div>\n        <div style=\"height:180px;border-radius:14px;background:repeating-linear-gradient(45deg, oklch(0.93 0.005 90), oklch(0.93 0.005 90) 10px, oklch(0.96 0.002 90) 10px, oklch(0.96 0.002 90) 20px);display:flex;align-items:center;justify-content:center;font-size:12px;color:oklch(0.55 0.005 90);font-family:ui-monospace,monospace;margin-bottom:18px\">article image<\u002Fdiv>\n        <div style=\"font-size:12px;letter-spacing:0.06em;text-transform:uppercase;color:oklch(0.58 0.16 45);font-weight:600;margin-bottom:8px\">Fundraising<\u002Fdiv>\n        <div style=\"font-size:19px;font-weight:600;color:oklch(0.15 0.005 90);line-height:1.4\">Why investors ask for proof before they ask for projections<\u002Fdiv>\n      <\u002Fdiv>\n    <\u002Fdiv>\n  <\u002Fdiv>\n\n  <!-- CTA -->\n  <div style=\"max-width:1200px;margin:112px auto 0;padding:64px 48px;background:oklch(0.15 0.005 90);border-radius:24px 24px 0 0;text-align:center\">\n    <div style=\"font-size:32px;font-weight:600;letter-spacing:-0.02em;color:#fff;margin-bottom:14px\">Ready to prove it out?<\u002Fdiv>\n    <div style=\"font-size:16px;color:oklch(0.72 0.005 90);margin-bottom:30px\">Tell us where your technology stands — we'll help you find the fastest path to proof.<\u002Fdiv>\n    <div style=\"display:inline-block;font-size:15px;font-weight:600;color:oklch(0.15 0.005 90);background:#fff;padding:14px 30px;border-radius:8px\">Contact us →<\u002Fdiv>\n  <\u002Fdiv>\n\n  <!-- FOOTER -->\n  <div styl
